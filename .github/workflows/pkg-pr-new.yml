name: pkg.pr.new

on:
  pull_request:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v3
        with:
          runtime: node@22

      - run: pnpm build
      - run: pnpm dlx pkg-pr-new publish --bin --packageManager=pnpm
