name: Deploy docs to Swarm (hoverfly)

# Build the docs, upload them to Swarm through a local hoverfly daemon and
# propose the ENS content-hash update to safe.omnipin.eth.
#
# Required repo secrets:
#   SWARM_KEY    Postage batch owner's signer (hex, 32 bytes).
#   SWARM_BATCH  Postage batch ID (hex, 32 bytes).
#   SWARM_NONCE  Overlay nonce (hex, 32 bytes), keeps the upload overlay stable.
#   OMNIPIN_PK   Proposer key (a Safe owner) for the ENS update.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v3
        with:
          runtime: node@22
          working-directory: docs

      - name: Start the hoverfly daemon
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download -R omnipin/hoverfly -p 'hoverfly-*-x86_64-unknown-linux-gnu.tar.gz' -O - \
            | tar -xz --strip-components=1
          # The bundled peers.seed.json goes stale; use the hourly-refreshed one.
          curl -fsSL -o peers.json https://raw.githubusercontent.com/omnipin/hoverfly-peers/main/peers.seed.json
          # Started before the docs build so the session pool fills meanwhile.
          ./hoverfly daemon --socket /tmp/hoverfly.sock --peerlist peers.json --pool-size 32 \
            > /tmp/hoverfly.log 2>&1 &

      - name: Build website
        working-directory: docs
        run: pnpm docs:build

      - name: Deploy
        env:
          OMNIPIN_HOVERFLY_TOKEN: ${{ secrets.SWARM_BATCH }}
          OMNIPIN_HOVERFLY_KEY: ${{ secrets.SWARM_KEY }}
          OMNIPIN_HOVERFLY_NONCE: ${{ secrets.SWARM_NONCE }}
          OMNIPIN_PK: ${{ secrets.OMNIPIN_PK }}
        run: |
          pnpm dlx omnipin deploy docs/.vitepress/dist --providers Hoverfly \
            --ens omnipin.eth --safe safe.omnipin.eth
